<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>快团团商品海报生成器</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff4d57'/%3E%3Ctext x='32' y='42' font-size='34' text-anchor='middle' fill='white'%3E团%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f5f6f8;
      --panel: #ffffff;
      --ink: #1f2329;
      --muted: #7b8494;
      --line: #e6e8ee;
      --soft: #f0f2f5;
      --accent: #ff4d57;
      --accent-soft: #fff3f4;
      --radius: 8px;
      --shadow: 0 18px 50px rgba(31, 35, 41, .08);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
    }

    button, input, textarea, select { font: inherit; }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(360px, 520px) 1fr;
    }

    .editor {
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 24px;
      overflow: auto;
      max-height: 100vh;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
    }

    .brand .mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      flex: 0 0 auto;
    }

    h1 {
      margin: 0;
      font-size: 19px;
      line-height: 1.2;
    }

    .badge {
      margin-left: 4px;
      padding: 3px 9px;
      border-radius: 999px;
      background: #dff7eb;
      color: #12814d;
      font-size: 12px;
      white-space: nowrap;
    }

    .section {
      padding: 18px 0;
      border-top: 1px solid var(--line);
    }

    .section:first-of-type { border-top: 0; padding-top: 0; }

    .section-title {
      margin: 0 0 12px;
      color: #5f6878;
      font-size: 13px;
      font-weight: 700;
    }

    .template-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .template-option {
      border: 1px solid #d8dde6;
      background: #fff;
      border-radius: 8px;
      padding: 9px;
      cursor: pointer;
      text-align: center;
      color: #3b4351;
      font-size: 13px;
      transition: border-color .15s, box-shadow .15s, color .15s;
    }

    .template-option.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(255, 77, 87, .18);
      color: var(--accent);
      font-weight: 700;
    }

    .swatch {
      height: 28px;
      border-radius: 6px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, var(--sw), color-mix(in srgb, var(--sw) 60%, #ffffff));
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #697386;
      font-size: 13px;
      font-weight: 650;
    }

    input[type="text"], input[type="number"], textarea, select {
      width: 100%;
      border: 1px solid #d9dee8;
      border-radius: 7px;
      background: #fff;
      color: var(--ink);
      padding: 11px 12px;
      outline: none;
      transition: border .15s, box-shadow .15s;
    }

    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 77, 87, .14);
    }

    textarea { min-height: 86px; resize: vertical; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .field { margin-bottom: 14px; }

    .hint {
      margin-top: 6px;
      color: #8a93a3;
      font-size: 12px;
      line-height: 1.5;
    }

    input[type="file"] {
      width: 100%;
      color: #6b7484;
      font-size: 13px;
      padding: 8px 0;
    }

    .points { display: grid; gap: 9px; }

    .point-row { display: grid; grid-template-columns: 1fr 40px; gap: 8px; }

    .icon-btn {
      border: 0;
      border-radius: 7px;
      background: #ffe8ea;
      color: var(--accent);
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }

    .add-btn, .export-btn, .reset-btn {
      width: 100%;
      border: 1px dashed #cbd2dd;
      border-radius: 7px;
      background: #fff;
      color: #667085;
      padding: 11px 12px;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
    }

    .add-btn:hover, .reset-btn:hover { border-color: var(--accent); color: var(--accent); }

    .export-btn:hover { background: #33383f; }
    .add-btn:disabled { opacity: .45; cursor: not-allowed; }
    .add-btn:disabled:hover { border-color: #cbd2dd; color: #667085; }

    .export-btn {
      border: 0;
      background: var(--ink);
      color: #fff;
      font-weight: 750;
    }

    .reset-btn { border-style: solid; }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      position: sticky;
      bottom: 0;
      padding: 14px 0 4px;
      background: linear-gradient(180deg, rgba(255,255,255,0), #fff 22%);
    }

    .preview-wrap {
      min-height: 100vh;
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      background:
        linear-gradient(90deg, rgba(31,35,41,.04) 1px, transparent 1px),
        linear-gradient(180deg, rgba(31,35,41,.04) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    .phone {
      width: min(100%, 390px, calc((100vh - 110px) * 0.5625));
      aspect-ratio: 720 / 1280;
      border-radius: 18px;
      overflow: hidden;
      background: #fff;
      box-shadow: var(--shadow);
      display: block;
    }

    .preview-canvas { width: 100%; height: 100%; display: block; background: #fff; }

    .preview-meta { color: #8a93a3; font-size: 12px; }

    /* ---------- 批量生成 ---------- */
    .batch-input {
      min-height: 118px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 12.5px;
      line-height: 1.6;
    }

    .batch-status {
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 12.5px;
      line-height: 1.5;
      margin-bottom: 10px;
      background: #f0f7ff;
      color: #185fa5;
    }

    .batch-status.warn { background: #fff8e6; color: #854f0b; }
    .batch-status.ok { background: #e8f8ef; color: #12814d; }
    .batch-status.busy { background: #f0f2f5; color: #5f6878; }

    .batch-list { display: grid; gap: 8px; }

    .batch-item {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      gap: 10px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px;
      background: #fff;
    }

    .batch-thumb {
      width: 44px;
      height: 78px;
      border-radius: 5px;
      background: #f0f2f5 center/cover no-repeat;
      border: 1px solid var(--line);
      flex: 0 0 auto;
    }

    .batch-item-main { min-width: 0; }

    .batch-item-title {
      font-size: 13px;
      font-weight: 650;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .batch-item-sub {
      margin-top: 3px;
      color: #8a93a3;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .batch-item-del {
      border: 0;
      border-radius: 6px;
      background: #ffe8ea;
      color: var(--accent);
      width: 30px;
      height: 30px;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
    }

    @media (max-width: 960px) {
      .app { grid-template-columns: 1fr; }
      .editor { max-height: none; border-right: 0; border-bottom: 1px solid var(--line); }
      .preview-wrap { min-height: auto; padding: 22px 14px 34px; }
      .phone { width: min(100%, 340px); }
    }

    @media (max-width: 520px) {
      .editor { padding: 18px 14px; }
      .template-row, .grid-2 { grid-template-columns: 1fr; }
      .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="editor" aria-label="素材信息填写">
      <div class="brand">
        <div class="mark">团</div>
        <h1>快团团海报生成器</h1>
        <span class="badge">本地版</span>
      </div>

      <div class="section">
        <p class="section-title">版式模板</p>
        <div class="template-row" role="group" aria-label="选择版式">
          <button class="template-option active" type="button" data-template="classic">
            <div class="swatch" style="--sw:#ff4d57"></div>
            居中促销
          </button>
          <button class="template-option" type="button" data-template="clean">
            <div class="swatch" style="--sw:#13a8c7"></div>
            左图清单
          </button>
          <button class="template-option" type="button" data-template="boom">
            <div class="swatch" style="--sw:#ff6c35"></div>
            大图爆款
          </button>
        </div>
      </div>

      <div class="section">
        <p class="section-title">基础信息</p>
        <div class="field">
          <label for="topTag">顶部标签</label>
          <input id="topTag" type="text" value="今日开团">
        </div>
        <div class="field">
          <label for="brandName">团长昵称 / 品牌</label>
          <input id="brandName" type="text" value="小美优选·团长">
        </div>
        <div class="field">
          <label for="productTitle">商品标题</label>
          <input id="productTitle" type="text" value="【新疆直发】阿克苏冰糖心苹果 5斤装">
        </div>
        <div class="field">
          <label for="subtitle">副标题 / 一句话卖点</label>
          <input id="subtitle" type="text" value="咬一口爆汁甜脆 · 产地现摘现发">
        </div>
      </div>

      <div class="section">
        <p class="section-title">图片素材</p>
        <div class="field">
          <label for="productImage">商品主图</label>
          <input id="productImage" type="file" accept="image/*">
          <div class="hint">推荐 3:4 竖图；方图会自动按 1:1 展示。预览与导出均在本机完成，不上传服务器。</div>
        </div>
        <div class="grid-2">
          <div class="field">
            <label for="imageRatio">图片展示比例</label>
            <select id="imageRatio">
              <option value="auto">自动识别</option>
              <option value="3:4">3:4 竖图</option>
              <option value="1:1">1:1 方图</option>
              <option value="free">保留原图比例</option>
            </select>
          </div>
          <div class="field">
            <label for="imageFit">图片适配方式</label>
            <select id="imageFit">
              <option value="contain">完整展示</option>
              <option value="cover">铺满裁切</option>
            </select>
          </div>
        </div>
        <div class="field">
          <label for="qrImage">二维码</label>
          <input id="qrImage" type="file" accept="image/*">
          <div class="hint">上传团长二维码或商品码。</div>
        </div>
      </div>

      <div class="section">
        <p class="section-title">核心卖点（最多 6 条）</p>
        <div id="points" class="points"></div>
        <button id="addPoint" class="add-btn" type="button">+ 添加一条卖点</button>
      </div>

      <div class="section">
        <p class="section-title">价格和转化文案</p>
        <div class="grid-2">
          <div class="field">
            <label for="originalPrice">原价 ¥</label>
            <input id="originalPrice" type="number" value="39.9" step="0.1" min="0">
          </div>
          <div class="field">
            <label for="salePrice">团购价 ¥</label>
            <input id="salePrice" type="number" value="19.9" step="0.1" min="0">
          </div>
        </div>
        <div class="field">
          <label for="leaderNote">团长说</label>
          <textarea id="leaderNote">我自己吃了两箱，真的甜！这个价格基本就是产地价了，库存不多，手慢无～</textarea>
        </div>
        <div class="field">
          <label for="shipping">规格 / 发货信息</label>
          <input id="shipping" type="text" value="5斤/箱 · 默认圆通 · 48h 内发货 · 坏果包赔">
        </div>
        <div class="grid-2">
          <div class="field">
            <label for="buttonMain">按钮主文案</label>
            <input id="buttonMain" type="text" value="长按识别 跟团购买">
          </div>
          <div class="field">
            <label for="buttonSub">按钮副文案</label>
            <input id="buttonSub" type="text" value="早买早发 · 手慢无">
          </div>
        </div>
      </div>

      <div class="section">
        <p class="section-title">批量生成</p>
        <div class="field">
          <label>商品数据（每行一个商品）</label>
          <textarea id="batchInput" class="batch-input" spellcheck="false" placeholder="团长昵称 | 商品标题 | 副标题 | 卖点1；卖点2；卖点3 | 原价 | 团购价 | 团长说 | 规格发货 | 顶部标签
小美优选 | 阿克苏苹果5斤 | 现摘现发 | 产地直发；爆汁甜 | 39.9 | 19.9 | 真的甜！ | 5斤/箱·包邮 | 今日开团"></textarea>
          <div class="hint">
            用 <b>|</b> 分隔字段，卖点之间用 <b>；</b>（分号）分隔。留空的字段使用左侧表单当前值兜底。首行若为列名会自动识别并跳过。
          </div>
        </div>
        <div class="grid-2">
          <div class="field">
            <label for="batchTemplate">批量版式</label>
            <select id="batchTemplate">
              <option value="follow">跟随当前版式</option>
              <option value="classic">居中促销</option>
              <option value="clean">左图清单</option>
              <option value="boom">大图爆款</option>
            </select>
          </div>
          <div class="field">
            <label for="batchImage">批量主图（可选）</label>
            <input id="batchImage" type="file" accept="image/*" multiple>
          </div>
        </div>
        <div class="hint" style="margin-top:-6px;margin-bottom:12px">
          选择多张图片时，按顺序分配给各商品；图片数量不足的商品沿用左侧表单主图。
        </div>
        <div class="grid-2" style="margin-bottom:12px">
          <button id="batchParse" class="add-btn" type="button">解析数据</button>
          <button id="batchExport" class="export-btn" type="button">批量导出</button>
        </div>
        <div id="batchStatus" class="batch-status" hidden></div>
        <div id="batchList" class="batch-list"></div>
      </div>

      <div class="actions">
        <button id="resetDemo" class="reset-btn" type="button">恢复示例</button>
        <button id="exportPng" class="export-btn" type="button">导出 PNG</button>
      </div>
    </section>

    <section class="preview-wrap" aria-label="素材预览">
      <article class="phone">
        <canvas id="previewCanvas" class="preview-canvas" width="720" height="1280" aria-label="海报预览画布"></canvas>
      </article>
      <p class="preview-meta">720 × 1280 px · 实时预览</p>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    const state = {
      template: "classic",
      productImage: "",
      qrImage: "",
      points: [
        "产地直发，没有中间商加价",
        "冰糖心占比高，一口爆汁甜",
        "坏果包赔，售后无忧"
      ]
    };

    const fields = [
      "topTag", "brandName", "productTitle", "subtitle", "originalPrice",
      "salePrice", "leaderNote", "shipping", "buttonMain", "buttonSub",
      "imageRatio", "imageFit"
    ];

    const FONT = "PingFang SC, Microsoft YaHei, -apple-system, BlinkMacSystemFont, sans-serif";

    function value(id) {
      return $(id).value.trim();
    }

    // 从表单收集一张海报所需的全部数据（单张模式与批量模式共用的数据契约）
    function collectFormData() {
      return {
        template: state.template,
        topTag: value("topTag"),
        brandName: value("brandName"),
        productTitle: value("productTitle"),
        subtitle: value("subtitle"),
        productImage: state.productImage,
        qrImage: state.qrImage,
        imageRatio: value("imageRatio") || "auto",
        imageFit: value("imageFit") || "contain",
        points: state.points.filter(Boolean).slice(0, 6),
        originalPrice: value("originalPrice"),
        salePrice: value("salePrice"),
        leaderNote: value("leaderNote"),
        shipping: value("shipping"),
        buttonMain: value("buttonMain"),
        buttonSub: value("buttonSub")
      };
    }

    function money(num) {
      const parsed = Number(num);
      if (!Number.isFinite(parsed) || parsed < 0) return "0.00";
      return parsed.toFixed(2);
    }

    function themeColor(tpl) {
      const t = tpl || state.template;
      if (t === "clean") return "#13a8c7";
      if (t === "boom") return "#ff6c35";
      return "#ff4d57";
    }

    function softColor(tpl) {
      const t = tpl || state.template;
      if (t === "clean") return "#eefafd";
      if (t === "boom") return "#fff4ee";
      return "#fff3f4";
    }

    function strokeColor(tpl) {
      const t = tpl || state.template;
      if (t === "clean") return "#bfeef6";
      if (t === "boom") return "#ffd9c6";
      return "#ffd6da";
    }

    /* ---------- 卖点编辑器 ---------- */
    function renderPointsEditor() {
      const wrap = $("points");
      wrap.innerHTML = "";
      state.points.forEach((point, index) => {
        const row = document.createElement("div");
        row.className = "point-row";

        const input = document.createElement("input");
        input.type = "text";
        input.value = point;
        input.placeholder = `卖点 ${index + 1}`;
        input.setAttribute("aria-label", `卖点 ${index + 1}`);
        input.addEventListener("input", () => {
          state.points[index] = input.value;
          render();
        });

        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "icon-btn";
        remove.textContent = "×";
        remove.title = "删除这条卖点";
        remove.addEventListener("click", () => {
          state.points.splice(index, 1);
          renderPointsEditor();
          render();
        });

        row.append(input, remove);
        wrap.append(row);
      });
      $("addPoint").disabled = state.points.length >= 6;
    }

    /* ---------- 工具函数 ---------- */
    function readFileAsDataUrl(file, callback) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => callback(String(reader.result));
      reader.readAsDataURL(file);
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
      const chars = Array.from(text || "");
      let line = "";
      const lines = [];
      for (const char of chars) {
        const test = line + char;
        if (ctx.measureText(test).width > maxWidth && line) {
          lines.push(line);
          line = char;
          if (lines.length === maxLines) break;
        } else {
          line = test;
        }
      }
      if (lines.length < maxLines && line) lines.push(line);
      const consumed = lines.join("").length;
      if (consumed < chars.length && lines.length) {
        let last = lines[lines.length - 1];
        while (last && ctx.measureText(last + "…").width > maxWidth) {
          last = last.slice(0, -1);
        }
        lines[lines.length - 1] = last + "…";
      }
      lines.forEach((item, index) => ctx.fillText(item, x, y + index * lineHeight));
      return y + lines.length * lineHeight;
    }

    function roundedRect(ctx, x, y, w, h, r) {
      const radius = Math.min(r, w / 2, h / 2);
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.arcTo(x + w, y, x + w, y + h, radius);
      ctx.arcTo(x + w, y + h, x, y + h, radius);
      ctx.arcTo(x, y + h, x, y, radius);
      ctx.arcTo(x, y, x + w, y, radius);
      ctx.closePath();
    }

    function drawImageCover(ctx, img, x, y, w, h) {
      const scale = Math.max(w / img.width, h / img.height);
      const sw = w / scale;
      const sh = h / scale;
      const sx = (img.width - sw) / 2;
      const sy = (img.height - sh) / 2;
      ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
    }

    function drawImageContain(ctx, img, x, y, w, h) {
      const scale = Math.min(w / img.width, h / img.height);
      const dw = img.width * scale;
      const dh = img.height * scale;
      const dx = x + (w - dw) / 2;
      const dy = y + (h - dh) / 2;
      ctx.drawImage(img, dx, dy, dw, dh);
    }

    function selectedImageRatio(img, ratioMode) {
      const mode = ratioMode || "auto";
      if (mode === "3:4") return 3 / 4;
      if (mode === "1:1") return 1;
      if (!img) return 3 / 4;
      const sourceRatio = img.width / img.height;
      if (mode === "free") return Math.max(.55, Math.min(1.3, sourceRatio));
      if (sourceRatio >= .9 && sourceRatio <= 1.1) return 1;
      return Math.max(.55, Math.min(1.3, sourceRatio));
    }

    function drawProductImage(ctx, img, x, y, w, h, fit) {
      ctx.save();
      roundedRect(ctx, x, y, w, h, 22);
      ctx.clip();
      if (!img) {
        ctx.fillStyle = "#eef1f5";
        ctx.fillRect(x, y, w, h);
        ctx.fillStyle = "#8e98a8";
        ctx.font = "500 28px " + FONT;
        ctx.textAlign = "center";
        ctx.fillText("商品主图", x + w / 2, y + h / 2 + 10);
        ctx.textAlign = "left";
      } else if ((fit || "contain") === "cover") {
        drawImageCover(ctx, img, x, y, w, h);
      } else {
        // contain：用模糊原图做底衬，避免出现白边
        ctx.filter = "blur(20px)";
        drawImageCover(ctx, img, x - 20, y - 20, w + 40, h + 40);
        ctx.filter = "none";
        ctx.fillStyle = "rgba(255,255,255,.26)";
        ctx.fillRect(x, y, w, h);
        drawImageContain(ctx, img, x, y, w, h);
      }
      ctx.restore();
    }

    function loadImage(src) {
      return new Promise((resolve) => {
        if (!src) return resolve(null);
        const img = new Image();
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    /* ---------- 海报绘制 ---------- */
    function drawPoster(ctx, data, productImg, qrImg) {
      const accent = themeColor(data.template);
      const isClean = data.template === "clean";
      const isBoom = data.template === "boom";

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, 720, 1280);

      // 顶栏
      ctx.fillStyle = isClean ? "#ffffff" : accent;
      ctx.fillRect(0, 0, 720, 90);
      if (isClean) {
        ctx.fillStyle = accent;
        ctx.fillRect(0, 86, 720, 4);
      }

      // 团长昵称
      ctx.fillStyle = isClean ? "#1f2329" : "#ffffff";
      ctx.font = "800 26px " + FONT;
      wrapText(ctx, data.brandName || "团长昵称", 36, 58, 430, 28, 1);

      // 顶部标签
      const tag = data.topTag || "今日开团";
      ctx.font = "800 24px " + FONT;
      const tagW = Math.min(220, ctx.measureText(tag).width + 48);
      roundedRect(ctx, 720 - tagW - 36, 20, tagW, 50, 25);
      ctx.fillStyle = "#ffd84d";
      ctx.fill();
      ctx.fillStyle = "#1f2329";
      ctx.fillText(tag, 720 - tagW - 12, 53);

      // 商品标题
      ctx.fillStyle = "#1f2329";
      ctx.font = "900 36px " + FONT;
      const titleBottom = wrapText(ctx, data.productTitle || "商品标题", 36, 132, 648, 40, 2);

      // 副标题胶囊
      const subtitleText = data.subtitle || "一句话卖点";
      ctx.font = "700 23px " + FONT;
      const subtitleW = Math.min(600, ctx.measureText(subtitleText).width + 34);
      const subtitleY = titleBottom + 10;
      roundedRect(ctx, 36, subtitleY, subtitleW, 42, 21);
      ctx.fillStyle = "#f4f6f9";
      ctx.fill();
      ctx.fillStyle = "#748092";
      wrapText(ctx, subtitleText, 53, subtitleY + 28, subtitleW - 34, 28, 1);

      // 主图尺寸
      const pointItems = (data.points || []).filter(Boolean).slice(0, 6);
      const sourceRatio = isBoom
        ? Math.max(1.05, selectedImageRatio(productImg, data.imageRatio))
        : selectedImageRatio(productImg, data.imageRatio);
      const baseImageHeight = Math.max(390, 510 - Math.max(0, pointItems.length - 3) * 38);
      const maxImageWidth = isBoom ? 648 : isClean ? 350 : 500;
      const imgH = Math.min(baseImageHeight, maxImageWidth / sourceRatio);
      const imgW = imgH * sourceRatio;
      const imgX = isClean ? 36 : (720 - imgW) / 2;
      const imgY = subtitleY + 56;

      // 主图阴影底板
      ctx.save();
      ctx.shadowColor = "rgba(31, 35, 41, .16)";
      ctx.shadowBlur = 24;
      ctx.shadowOffsetY = 12;
      roundedRect(ctx, imgX, imgY, imgW, imgH, 22);
      ctx.fillStyle = "#ffffff";
      ctx.fill();
      ctx.restore();

      drawProductImage(ctx, productImg, imgX, imgY, imgW, imgH, data.imageFit);

      // 卖点列表
      let y = isClean ? imgY + 40 : imgY + imgH + 56;
      ctx.textBaseline = "alphabetic";
      pointItems.forEach((point, index) => {
        const pointX = isClean ? imgX + imgW + 30 : 90;
        const markerX = isClean ? imgX + imgW + 16 : 58;
        const pointWidth = isClean ? 720 - pointX - 28 : 590;
        ctx.fillStyle = accent;
        ctx.beginPath();
        ctx.arc(markerX, y - 8, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.font = "900 20px " + FONT;
        ctx.textAlign = "center";
        ctx.fillText(String(index + 1), markerX, y);
        ctx.textAlign = "left";
        ctx.fillStyle = "#1f2329";
        ctx.font = "700 24px " + FONT;
        y = wrapText(ctx, point, pointX, y, pointWidth, 30, isClean ? 2 : 1) + 8;
      });

      if (isClean) y = Math.max(y, imgY + imgH + 24);

      // 价格卡片
      y += 4;
      roundedRect(ctx, 36, y, 648, 86, 18);
      ctx.fillStyle = softColor(data.template);
      ctx.fill();
      ctx.strokeStyle = strokeColor(data.template);
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = accent;
      ctx.font = "900 31px " + FONT;
      ctx.fillText("¥", 68, y + 56);
      ctx.font = "950 52px " + FONT;
      ctx.fillText(money(data.salePrice), 108, y + 60);
      ctx.fillStyle = "#a2aab8";
      ctx.font = "400 24px " + FONT;
      const originalText = "¥" + money(data.originalPrice);
      ctx.fillText(originalText, 296, y + 56);
      ctx.strokeStyle = "#a2aab8";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(296, y + 47);
      ctx.lineTo(296 + ctx.measureText(originalText).width, y + 47);
      ctx.stroke();

      const discount = Math.max(0, Number(data.originalPrice) - Number(data.salePrice));
      const saveText = discount > 0 ? "立省 ¥" + Math.round(discount) : "立即跟团";
      roundedRect(ctx, 512, y + 17, 132, 52, 26);
      ctx.fillStyle = accent;
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.font = "900 24px " + FONT;
      ctx.textAlign = "center";
      ctx.fillText(saveText, 578, y + 52);
      ctx.textAlign = "left";

      // 团长说
      y += 98;
      roundedRect(ctx, 36, y, 648, 76, 18);
      ctx.fillStyle = "#f4f6f9";
      ctx.fill();
      ctx.fillStyle = accent;
      ctx.font = "800 23px " + FONT;
      ctx.fillText("团长说：", 66, y + 32);
      ctx.fillStyle = "#3d4655";
      ctx.font = "500 23px " + FONT;
      wrapText(ctx, data.leaderNote || "这里填写团长推荐语", 160, y + 32, 500, 27, 2);

      // 虚线分隔
      y += 86;
      ctx.strokeStyle = "#e1e5ed";
      ctx.setLineDash([7, 7]);
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(720, y);
      ctx.stroke();
      ctx.setLineDash([]);

      // 底部二维码 + 按钮
      y += 16;
      roundedRect(ctx, 24, y - 10, 672, 110, 18);
      ctx.fillStyle = "#fbfcfe";
      ctx.fill();
      ctx.strokeStyle = "#edf0f5";
      ctx.lineWidth = 1;
      ctx.stroke();

      roundedRect(ctx, 36, y, 80, 80, 16);
      ctx.fillStyle = "#eef0f4";
      ctx.fill();
      ctx.save();
      roundedRect(ctx, 36, y, 80, 80, 16);
      ctx.clip();
      if (qrImg) {
        drawImageCover(ctx, qrImg, 36, y, 80, 80);
      } else {
        ctx.fillStyle = "#b0b8c6";
        ctx.font = "750 20px " + FONT;
        ctx.textAlign = "center";
        ctx.fillText("二维码", 76, y + 48);
        ctx.textAlign = "left";
      }
      ctx.restore();

      ctx.fillStyle = "#1f2329";
      ctx.font = "950 28px " + FONT;
      wrapText(ctx, data.buttonMain || "长按识别 跟团购买", 140, y + 33, 524, 32, 1);
      ctx.fillStyle = "#7f8998";
      ctx.font = "650 22px " + FONT;
      wrapText(ctx, data.buttonSub || "早买早发 · 手慢无", 140, y + 64, 524, 28, 1);
      ctx.fillStyle = "#7f8998";
      ctx.font = "500 19px " + FONT;
      wrapText(ctx, data.shipping || "规格 / 发货信息", 140, y + 96, 524, 24, 1);
    }

    async function getPosterImages() {
      const productImg = await loadImage(state.productImage);
      const qrImg = await loadImage(state.qrImage);
      return { productImg, qrImg };
    }

    let renderToken = 0;

    async function render() {
      const token = ++renderToken;
      const ctx = $("previewCanvas").getContext("2d");
      const { productImg, qrImg } = await getPosterImages();
      if (token !== renderToken) return;
      drawPoster(ctx, collectFormData(), productImg, qrImg);
    }

    async function exportPoster() {
      const canvas = document.createElement("canvas");
      canvas.width = 720;
      canvas.height = 1280;
      const ctx = canvas.getContext("2d");
      const { productImg, qrImg } = await getPosterImages();
      drawPoster(ctx, collectFormData(), productImg, qrImg);
      const link = document.createElement("a");
      link.download = "快团团海报-" + Date.now() + ".png";
      link.href = canvas.toDataURL("image/png");
      link.click();
    }

    function resetDemo() {
      $("topTag").value = "今日开团";
      $("brandName").value = "小美优选·团长";
      $("productTitle").value = "【新疆直发】阿克苏冰糖心苹果 5斤装";
      $("subtitle").value = "咬一口爆汁甜脆 · 产地现摘现发";
      $("originalPrice").value = "39.9";
      $("salePrice").value = "19.9";
      $("leaderNote").value = "我自己吃了两箱，真的甜！这个价格基本就是产地价了，库存不多，手慢无～";
      $("shipping").value = "5斤/箱 · 默认圆通 · 48h 内发货 · 坏果包赔";
      $("buttonMain").value = "长按识别 跟团购买";
      $("buttonSub").value = "早买早发 · 手慢无";
      $("imageRatio").value = "auto";
      $("imageFit").value = "contain";
      state.points = [
        "产地直发，没有中间商加价",
        "冰糖心占比高，一口爆汁甜",
        "坏果包赔，售后无忧"
      ];
      state.productImage = "";
      state.qrImage = "";
      $("productImage").value = "";
      $("qrImage").value = "";
      renderPointsEditor();
      render();
    }

    /* ---------- 批量生成 ---------- */
    const BATCH_COLUMNS = [
      "brandName", "productTitle", "subtitle", "points",
      "originalPrice", "salePrice", "leaderNote", "shipping", "topTag"
    ];

    const BATCH_HEADER_HINTS = ["团长昵称", "品牌", "商品标题", "标题", "副标题",
      "卖点", "原价", "团购价", "现价", "团长说", "规格", "发货", "标签", "昵称"];

    // 判断首行是否为列名表头：真实表头通常命中 3 个以上列名关键词
    // （数据行偶然含 1-2 个如"卖点""规格"，需 3 个以上才判为表头）
    function looksLikeHeader(cells) {
      const joined = cells.join("");
      const hits = BATCH_HEADER_HINTS.filter((h) => joined.includes(h)).length;
      return hits >= 3;
    }

    let batchItems = [];
    let batchImages = [];   // DataURL 列表，按顺序分配

    function status(msg, kind) {
      const el = $("batchStatus");
      if (!msg) { el.hidden = true; return; }
      el.hidden = false;
      el.className = "batch-status" + (kind ? " " + kind : "");
      el.textContent = msg;
    }

    function parseBatch(text) {
      const lines = text.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
      const items = [];
      lines.forEach((line, index) => {
        const cells = line.split("|").map((c) => c.trim());
        // 首行若疑似列名表头，则跳过
        if (index === 0 && cells.length > 1 && looksLikeHeader(cells)) return;
        const row = {};
        BATCH_COLUMNS.forEach((key, i) => { row[key] = cells[i] || ""; });
        row.points = (row.points || "").split(/[；;、]/).map((p) => p.trim()).filter(Boolean);
        if (!row.productTitle && !row.brandName) return;
        items.push(row);
      });
      return items;
    }

    function buildPosterData(item) {
      const base = collectFormData();
      const tpl = $("batchTemplate").value;
      return {
        template: tpl === "follow" ? base.template : tpl,
        topTag: item.topTag || base.topTag,
        brandName: item.brandName || base.brandName,
        productTitle: item.productTitle || base.productTitle,
        subtitle: item.subtitle || base.subtitle,
        imageRatio: base.imageRatio,
        imageFit: base.imageFit,
        points: item.points.length ? item.points : base.points,
        originalPrice: item.originalPrice || base.originalPrice,
        salePrice: item.salePrice || base.salePrice,
        leaderNote: item.leaderNote || base.leaderNote,
        shipping: item.shipping || base.shipping,
        buttonMain: base.buttonMain,
        buttonSub: base.buttonSub
      };
    }

    function renderBatchList() {
      const list = $("batchList");
      list.innerHTML = "";
      batchItems.forEach((item, index) => {
        const data = buildPosterData(item);
        const row = document.createElement("div");
        row.className = "batch-item";

        const thumb = document.createElement("div");
        thumb.className = "batch-thumb";
        const imgSrc = item.productImage || state.productImage;
        if (imgSrc) thumb.style.backgroundImage = `url("${imgSrc}")`;

        const main = document.createElement("div");
        main.className = "batch-item-main";
        const title = document.createElement("div");
        title.className = "batch-item-title";
        title.textContent = data.productTitle || "（无标题）";
        const sub = document.createElement("div");
        sub.className = "batch-item-sub";
        const priceText = "¥" + money(data.salePrice) + "（原 ¥" + money(data.originalPrice) + "）";
        sub.textContent = priceText + " · " + (data.brandName || "未署名");
        main.append(title, sub);

        const del = document.createElement("button");
        del.type = "button";
        del.className = "batch-item-del";
        del.textContent = "×";
        del.title = "移除这条";
        del.addEventListener("click", () => {
          batchItems.splice(index, 1);
          renderBatchList();
        });

        row.append(thumb, main, del);
        list.append(row);
      });
    }

    function refreshBatchPreview() {
      if (!batchItems.length) return;
      const canvas = document.createElement("canvas");
      canvas.width = 720;
      canvas.height = 1280;
      const ctx = canvas.getContext("2d");
      const data = buildPosterData(batchItems[0]);
      const imgSrc = batchItems[0].productImage || state.productImage;
      Promise.all([loadImage(imgSrc), loadImage(state.qrImage)]).then(([p, q]) => {
        drawPoster(ctx, data, p, q);
      });
    }

    function doParse() {
      const text = $("batchInput").value;
      if (!text.trim()) {
        status("请先粘贴商品数据，每行一个商品。", "warn");
        return;
      }
      batchItems = parseBatch(text);
      // 图片按顺序分配
      batchItems.forEach((item, i) => {
        item.productImage = batchImages[i] || "";
      });
      if (!batchItems.length) {
        status("没有解析到有效商品，请检查分隔符是否为 | 。", "warn");
        renderBatchList();
        return;
      }
      status(`已解析 ${batchItems.length} 个商品。第一个商品的预览已更新到右侧。`, "ok");
      renderBatchList();
      refreshBatchPreview();
    }

    function canvasToPngBytes(canvas) {
      // toDataURL 同步编码 PNG，headless 与真实浏览器行为一致
      const base64 = canvas.toDataURL("image/png").split(",")[1];
      const bin = atob(base64);
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i += 1) bytes[i] = bin.charCodeAt(i);
      return bytes;
    }

    function safeFileName(text, fallback) {
      const clean = (text || "").replace(/[\\/:*?"<>|\s]/g, "").slice(0, 24);
      return clean || fallback;
    }

    async function doBatchExport() {
      if (!batchItems.length) {
        status("请先点击「解析数据」，再执行批量导出。", "warn");
        return;
      }
      const total = batchItems.length;
      const btn = $("batchExport");
      btn.disabled = true;
      const qrImg = await loadImage(state.qrImage);
      const blobs = [];

      for (let i = 0; i < total; i += 1) {
        status(`正在生成 ${i + 1} / ${total} …`, "busy");
        const item = batchItems[i];
        const data = buildPosterData(item);
        const imgSrc = item.productImage || state.productImage;
        const productImg = await loadImage(imgSrc);
        const canvas = document.createElement("canvas");
        canvas.width = 720;
        canvas.height = 1280;
        const ctx = canvas.getContext("2d");
        drawPoster(ctx, data, productImg, qrImg);
        const bytes = canvasToPngBytes(canvas);
        const name = String(i + 1).padStart(2, "0") + "-" + safeFileName(data.productTitle, "海报") + ".png";
        blobs.push({ name, buffer: bytes.buffer });
        await new Promise((r) => setTimeout(r, 0));
      }

      downloadBlobsZip(blobs);
      btn.disabled = false;
      status(`已生成 ${total} 张海报，正在打包下载（快团团海报集.zip）。`, "ok");
    }

    // 极简 ZIP 打包（store 模式，不压缩）——避免引入外部库
    function crc32(bytes) {
      let crc = -1;
      for (let i = 0; i < bytes.length; i += 1) {
        crc ^= bytes[i];
        for (let j = 0; j < 8; j += 1) {
          crc = (crc >>> 1) ^ (0xEDB88320 & -(crc & 1));
        }
      }
      return (crc ^ -1) >>> 0;
    }

    function buildZip(entries) {
      const enc = new TextEncoder();
      const chunks = [];
      const central = [];
      let offset = 0;

      entries.forEach((entry) => {
        const nameBytes = enc.encode(entry.name);
        const dataBytes = new Uint8Array(entry.buffer);
        const crc = crc32(dataBytes);

        const local = new Uint8Array(30 + nameBytes.length);
        const lv = new DataView(local.buffer);
        lv.setUint32(0, 0x04034b50, true);
        lv.setUint16(4, 20, true);
        lv.setUint16(6, 0, true);
        lv.setUint16(8, 0, true);
        lv.setUint16(10, 0, true);
        lv.setUint16(12, 0, true);
        lv.setUint32(14, crc, true);
        lv.setUint32(18, dataBytes.length, true);
        lv.setUint32(22, dataBytes.length, true);
        lv.setUint16(26, nameBytes.length, true);
        lv.setUint16(28, 0, true);
        local.set(nameBytes, 30);
        chunks.push(local, dataBytes);

        const cd = new Uint8Array(46 + nameBytes.length);
        const cv = new DataView(cd.buffer);
        cv.setUint32(0, 0x02014b50, true);
        cv.setUint16(4, 20, true);
        cv.setUint16(6, 20, true);
        cv.setUint16(8, 0, true);
        cv.setUint16(10, 0, true);
        cv.setUint16(12, 0, true);
        cv.setUint16(14, 0, true);
        cv.setUint32(16, crc, true);
        cv.setUint32(20, dataBytes.length, true);
        cv.setUint32(24, dataBytes.length, true);
        cv.setUint16(28, nameBytes.length, true);
        cv.setUint16(30, 0, true);
        cv.setUint16(32, 0, true);
        cv.setUint16(34, 0, true);
        cv.setUint16(36, 0, true);
        cv.setUint32(38, 0, true);
        cv.setUint32(42, offset, true);
        cd.set(nameBytes, 46);
        central.push(cd);

        offset += local.length + dataBytes.length;
      });

      const centralSize = central.reduce((sum, c) => sum + c.length, 0);
      const end = new Uint8Array(22);
      const ev = new DataView(end.buffer);
      ev.setUint32(0, 0x06054b50, true);
      ev.setUint16(8, entries.length, true);
      ev.setUint16(10, entries.length, true);
      ev.setUint32(12, centralSize, true);
      ev.setUint32(16, offset, true);

      return new Blob([...chunks, ...central, end], { type: "application/zip" });
    }

    function downloadBlobsZip(blobs) {
      // blobs 中已含 buffer（ArrayBuffer）
      const zip = buildZip(blobs);
      const link = document.createElement("a");
      link.download = "快团团海报集-" + Date.now() + ".zip";
      link.href = URL.createObjectURL(zip);
      link.click();
      setTimeout(() => URL.revokeObjectURL(link.href), 4000);
    }

    function bind() {
      fields.forEach((id) => {
        $(id).addEventListener("input", render);
        $(id).addEventListener("change", render);
      });
      document.querySelectorAll(".template-option").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll(".template-option").forEach((item) => item.classList.remove("active"));
          button.classList.add("active");
          state.template = button.dataset.template;
          render();
        });
      });

      $("addPoint").addEventListener("click", () => {
        if (state.points.length >= 6) return;
        state.points.push("");
        renderPointsEditor();
        render();
      });

      $("productImage").addEventListener("change", (event) => {
        readFileAsDataUrl(event.target.files[0], (src) => {
          state.productImage = src;
          render();
        });
      });

      $("qrImage").addEventListener("change", (event) => {
        readFileAsDataUrl(event.target.files[0], (src) => {
          state.qrImage = src;
          render();
        });
      });

      $("resetDemo").addEventListener("click", resetDemo);
      $("exportPng").addEventListener("click", exportPoster);

      $("batchParse").addEventListener("click", doParse);
      $("batchExport").addEventListener("click", doBatchExport);

      $("batchImage").addEventListener("change", async (event) => {
        const files = Array.from(event.target.files || []);
        if (!files.length) return;
        batchImages = [];
        for (const file of files) {
          const src = await new Promise((resolve) => readFileAsDataUrl(file, resolve));
          batchImages.push(src);
        }
        if (batchItems.length) {
          batchItems.forEach((item, i) => { item.productImage = batchImages[i] || ""; });
          renderBatchList();
          refreshBatchPreview();
        }
        status(`已选择 ${batchImages.length} 张图片，将按顺序分配给各商品。`, "ok");
      });
    }

    bind();
    renderPointsEditor();
    render();
  </script>
</body>
